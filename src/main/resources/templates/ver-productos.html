<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver productos | Admin</title>

    <link rel="stylesheet" href="/css/ver-productos.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="/javascript/global.js" defer></script>
    <script src="/javascript/ver-productos.js" defer></script>
</head>
<body>

<header class="main-header">

    <div class="brand-section">

        <img src="/images/logo.png"
             alt="Logo"
             class="logo-img">

        <img src="/images/nombre.png"
             alt="Nombre"
             class="name-img">

        <img src="/images/slogan.png"
             alt="Slogan"
             class="slogan-img">

    </div>

    <nav class="navbar"></nav>

</header>

<main class="products-container">

    <section class="products-header">

        <span>Administración</span>

        <h1>Gestión de productos</h1>

        <p>
            Consulta, edita o desactiva vestidos del catálogo.
        </p>

    </section>

    <section class="products-grid"
             id="productsGrid"></section>

</main>

<footer class="footer">
    <p>© 2026 Indira trajes típicos</p>
</footer>

</body>
</html>
