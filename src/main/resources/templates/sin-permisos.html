<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{permissions.page.title}">Sin permisos | INDIRA</title>

    <link rel="stylesheet" href="/css/sin-permisos.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="/javascript/global.js" defer></script>
</head>
<body>

<header class="main-header">
    <div class="brand-section">
        <img src="/images/logo.png"
             th:alt="#{permissions.logo.alt}"
             alt="Logo Indira"
             class="logo-img">

        <img src="/images/nombre.png"
             th:alt="#{permissions.name.alt}"
             alt="Indira Trajes Típicos"
             class="name-img">

        <img src="/images/slogan.png"
             th:alt="#{permissions.slogan.alt}"
             alt="Vive la tradición con elegancia"
             class="slogan-img">
    </div>

    <nav class="navbar"></nav>
</header>

<main class="permission-page">
    <section class="permission-card">
        <i class="bi bi-shield-lock-fill"></i>

        <h1 th:text="#{permissions.title}">No tienes permisos</h1>

        <p th:text="#{permissions.description}">
            Esta sección está reservada para otro tipo de usuario.
            Verifica que hayas iniciado sesión con la cuenta correcta.
        </p>

        <a th:href="@{/(lang=${#locale.language})}"
           href="/"
           class="home-btn">

            <i class="bi bi-house-heart-fill"></i>
            <span th:text="#{permissions.back.home}">Volver al inicio</span>
        </a>
    </section>
</main>

<footer class="footer">
    <p th:text="#{permissions.footer}">© 2026 Indira trajes típicos</p>
</footer>

</body>
</html>
