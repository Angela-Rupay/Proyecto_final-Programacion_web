<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sin permisos | INDIRA</title>

    <link rel="stylesheet" href="/css/sin-permisos.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="/javascript/global.js" defer></script>
</head>
<body>

<header class="main-header">
    <div class="brand-section">
        <img src="/images/logo.png" alt="Logo Indira" class="logo-img">
        <img src="/images/nombre.png" alt="Indira Trajes Típicos" class="name-img">
        <img src="/images/slogan.png" alt="Vive la tradición con elegancia" class="slogan-img">
    </div>

    <nav class="navbar"></nav>
</header>

<main class="permission-page">
    <section class="permission-card">
        <i class="bi bi-shield-lock-fill"></i>

        <h1>No tienes permisos</h1>

        <p>
            Esta sección está reservada para otro tipo de usuario.
            Verifica que hayas iniciado sesión con la cuenta correcta.
        </p>

        <a href="/" class="home-btn">
            <i class="bi bi-house-heart-fill"></i>
            Volver al inicio
        </a>
    </section>
</main>

<footer class="footer">
    <p>© 2026 Indira trajes típicos</p>
</footer>

</body>
</html>
