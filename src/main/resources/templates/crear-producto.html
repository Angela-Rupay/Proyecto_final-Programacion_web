<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear producto | Admin</title>

    <link rel="stylesheet" href="/css/crear-producto.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="/javascript/global.js" defer></script>
    <script src="/javascript/crear-producto.js" defer></script>
</head>
<body>

<header class="main-header">

    <div class="brand-section">

        <img src="/images/logo.png"
             alt="Logo"
             class="logo-img">

        <img src="/images/nombre.png"
             alt="Nombre"
             class="name-img">

        <img src="/images/slogan.png"
             alt="Slogan"
             class="slogan-img">

    </div>

    <nav class="navbar"></nav>

</header>

<main class="form-page">

    <section class="form-header">

        <span>Administración</span>

        <h1 id="pageTitle">
            Crear producto
        </h1>

        <p>
            Registra o actualiza los datos principales de un vestido del catálogo.
        </p>

    </section>

    <section class="form-card">

        <form id="productForm">

            <!-- NOMBRE -->

            <div class="input-group">

                <label for="nombre">

                    <i class="bi bi-bag-heart-fill"></i>

                    Nombre del vestido

                </label>

                <input type="text"
                       id="nombre"
                       placeholder="Ej: Vestido Primavera"
                       required>

            </div>

            <!-- GRID -->

            <div class="input-grid">

                <div class="input-group">

                    <label for="talla">

                        <i class="bi bi-rulers"></i>

                        Talla

                    </label>

                    <select id="talla" required>
                        <option value="">Selecciona una talla</option>
                        <option value="0">Talla 0</option>
                        <option value="2">Talla 2</option>
                        <option value="4">Talla 4</option>
                        <option value="6">Talla 6</option>
                        <option value="8">Talla 8</option>
                        <option value="10">Talla 10</option>
                        <option value="12">Talla 12</option>
                        <option value="14">Talla 14</option>
                        <option value="16">Talla 16</option>
                        <option value="S">Talla S</option>
                        <option value="M">Talla M</option>
                        <option value="L">Talla L</option>
                        <option value="XL">Talla XL</option>
                    </select>

                </div>

                <div class="input-group">

                    <label for="precioBase">

                        <i class="bi bi-cash-coin"></i>

                        Precio base

                    </label>

                    <input type="number"
                           id="precioBase"
                           placeholder="Ej: 450000"
                           min="1"
                           required>

                </div>

            </div>

            <!-- MODELO -->

            <div class="input-group">

                <label for="idModelo">

                    <i class="bi bi-palette-fill"></i>

                    Modelo

                </label>

                <select id="idModelo" required>

                    <option value="">
                        Selecciona un modelo
                    </option>

                    <option value="TT">
                        Tradicional
                    </option>

                    <option value="TF">
                        Fantasía
                    </option>

                    <option value="P">
                        Pintado
                    </option>

                    <option value="TPRO">
                        Profesional
                    </option>

                </select>

            </div>

            <!-- IMÁGENES -->

            <div class="images-section">

                <h3>

                    <i class="bi bi-images"></i>

                    Imágenes del vestido

                </h3>

                <div class="images-grid">

                    <!-- IMAGEN 1 -->

                    <div class="image-upload">

                        <label for="imagen1">
                            Imagen principal
                        </label>

                        <input type="file"
                               id="imagen1"
                               accept="image/*"
                               required>

                        <img id="preview1"
                             class="preview-image"
                             src="/images/logo.png"
                             alt="Preview imagen principal">

                    </div>

                    <!-- IMAGEN 2 -->

                    <div class="image-upload">

                        <label for="imagen2">
                            Imagen secundaria
                        </label>

                        <input type="file"
                               id="imagen2"
                               accept="image/*"
                               required>

                        <img id="preview2"
                             class="preview-image"
                             src="/images/logo.png"
                             alt="Preview imagen secundaria">

                    </div>

                    <!-- IMAGEN 3 -->

                    <div class="image-upload">

                        <label for="imagen3">
                            Imagen adicional
                        </label>

                        <input type="file"
                               id="imagen3"
                               accept="image/*"
                               required>

                        <img id="preview3"
                             class="preview-image"
                             src="/images/logo.png"
                             alt="Preview imagen adicional">

                    </div>

                </div>

            </div>

            <!-- INFO -->

            <div class="info-box">

                <i class="bi bi-info-circle-fill"></i>

                <p>
                    Selecciona tres imágenes del vestido.
                    La primera será usada como imagen principal en el catálogo.
                </p>

            </div>

            <!-- MENSAJES -->

            <div class="message-box"
                 id="messageBox"></div>

            <!-- BOTONES -->

            <div class="form-buttons">

                <a href="/ver-productos"
                   class="back-btn">

                    <i class="bi bi-arrow-left"></i>

                    Volver

                </a>

                <button type="submit"
                        class="save-btn"
                        id="saveBtn">

                    <i class="bi bi-check-circle-fill"></i>

                    Guardar producto

                </button>

            </div>

        </form>

    </section>

</main>

<footer class="footer">

    <p>
        © 2026 Indira trajes típicos
    </p>

</footer>

</body>
</html>
