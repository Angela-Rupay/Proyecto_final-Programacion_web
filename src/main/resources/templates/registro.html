<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{register.page.title}">Registro | INDIRA</title>

    <link rel="stylesheet" href="/css/registro.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="/javascript/global.js" defer></script>
    <script src="/javascript/registro.js" defer></script>
</head>
<body>

<section class="register-page">

    <!-- PANEL IZQUIERDO -->

    <div class="slider-section">

        <div class="slider-card">

            <div class="slider-image-wrapper">
                <img id="sliderImage"
                     src="/images/sanjuanero/invitacion.jpg"
                     th:alt="#{register.slider.image.alt}"
                     alt="Figura del Sanjuanero">
            </div>

            <div class="slider-info">
                <span th:text="#{register.slider.label}">FIGURA DEL SANJUANERO</span>

                <div class="slider-line"></div>

                <h1 id="sliderTitle" >
                    Invitación
                </h1>

                <div class="slider-dots"
                     id="sliderDots"></div>
            </div>

        </div>

    </div>

    <!-- FORMULARIO -->

    <div class="form-section">

        <div class="form-container">

            <span class="form-label" th:text="#{register.form.label}">
                Únete a INDIRA
            </span>

            <h2 th:text="#{register.form.title}">Crear cuenta</h2>

            <form id="registroForm">

                <div class="input-grid">

                    <div class="input-group">
                        <label>
                            <i class="bi bi-person-fill"></i>
                            <span th:text="#{register.name.label}">Nombre</span>
                        </label>

                        <input type="text"
                               id="nombre"
                               th:placeholder="#{register.name.placeholder}"
                               placeholder="Angela"
                               required>
                    </div>

                    <div class="input-group">
                        <label>
                            <i class="bi bi-person-fill"></i>
                            <span th:text="#{register.lastname.label}">Apellido</span>
                        </label>

                        <input type="text"
                               id="apellido"
                               th:placeholder="#{register.lastname.placeholder}"
                               placeholder="Rojas"
                               required>
                    </div>

                </div>

                <div class="input-group">
                    <label>
                        <i class="bi bi-credit-card-2-front-fill"></i>
                        <span th:text="#{register.document.label}">Número de cédula</span>
                    </label>


                    <input type="text"
                           id="documento"
                           inputmode="numeric"
                           pattern="[0-9]*"
                           th:placeholder="#{register.document.placeholder}"
                           placeholder="1234567890"
                           required>

                </div>

                <div class="input-group">
                    <label>
                        <i class="bi bi-envelope-fill"></i>
                        <span th:text="#{register.email.label}">Correo electrónico</span>
                    </label>

                    <input type="email"
                           id="correo"
                           th:placeholder="#{register.email.placeholder}"
                           placeholder="correo@ejemplo.com"
                           required>
                </div>

                <div class="input-group">
                    <label>
                        <i class="bi bi-telephone-fill"></i>
                        <span th:text="#{register.phone.label}">Teléfono</span>
                    </label>

                    <input type="text"
                           id="telefono"
                           inputmode="numeric"
                           pattern="[0-9]*"
                           th:placeholder="#{register.phone.placeholder}"
                           placeholder="3XXXXXXXXX"
                           required>
                </div>

                <div class="input-group">
                    <label>
                        <i class="bi bi-lock-fill"></i>
                        <span th:text="#{register.password.label}">Contraseña</span>
                    </label>

                    <div class="password-container">

                        <input type="password"
                               id="password"
                               th:placeholder="#{register.password.placeholder}"
                               placeholder="Crea una contraseña segura"
                               required>

                        <button type="button"
                                class="toggle-password"
                                id="togglePassword"
                                th:title="#{register.password.toggle}"
                                th:aria-label="#{register.password.toggle}"
                                title="Mostrar u ocultar contraseña"
                                aria-label="Mostrar u ocultar contraseña">

                            <i class="bi bi-eye-fill"></i>

                        </button>

                    </div>

                </div>

                <!-- VALIDACIONES -->

                <div class="password-rules">

                    <div class="rule" id="ruleLength">
                        <i class="bi bi-circle"></i>
                        <span th:text="#{register.password.rule.length}">Mínimo 8 caracteres</span>
                    </div>

                    <div class="rule" id="ruleUppercase">
                        <i class="bi bi-circle"></i>
                        <span th:text="#{register.password.rule.uppercase}">Al menos una mayúscula</span>
                    </div>

                    <div class="rule" id="ruleNumber">
                        <i class="bi bi-circle"></i>
                        <span th:text="#{register.password.rule.number}">Al menos un número</span>
                    </div>

                </div>

                <div class="message-box"
                     id="messageBox"></div>

                <button type="submit"
                        class="register-btn"
                        id="registerBtn"
                        disabled>

                    <i class="bi bi-person-plus-fill"></i>
                    <span th:text="#{register.button.submit}">Registrarme</span>

                </button>

            </form>

            <p class="login-link">
                <span th:text="#{register.already.account}">¿Ya tienes una cuenta?</span>

                <a th:href="@{/login(lang=${#locale.language})}"
                   href="/login"
                   th:text="#{register.login.link}">
                    Inicia sesión
                </a>
            </p>

            <br>

            <a href="/oauth2/authorization/google" class="btn-google">
                <i class="bi bi-google"></i>
                <span th:text="#{register.google.button}">Registrarme con Google</span>
            </a>

            <a th:href="@{/(lang=${#locale.language})}"
               href="/"
               class="back-home">

                <i class="bi bi-arrow-left"></i>
                <span th:text="#{register.back.home}">Volver al inicio</span>

            </a>
        </div>

    </div>

</section>

<!-- MODAL -->

<div class="modal-overlay"
     id="modalOverlay">

    <div class="success-modal">

        <i class="bi bi-check-circle-fill"></i>

        <h2 th:text="#{register.modal.title}">Registro exitoso</h2>

        <p th:text="#{register.modal.description}">
            Tu cuenta fue creada correctamente.
        </p>

        <div class="modal-buttons">

            <a th:href="@{/catalogo(lang=${#locale.language})}"
               href="/catalogo"
               class="modal-btn primary"
               th:text="#{register.modal.catalog}">
                Ver catálogo
            </a>

            <a th:href="@{/(lang=${#locale.language})}"
               href="/"
               class="modal-btn secondary"
               th:text="#{register.modal.home}">
                Ir al inicio
            </a>

        </div>

    </div>

</div>

</body>
</html>
