<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingresando...</title>
</head>
<body>

<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (token) {
        localStorage.setItem("token", token);
        window.location.href = "/catalogo";
    } else {
        window.location.href = "/login";
    }
</script>

</body>
</html>
