<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingresando...</title>
</head>
<body>

<script>
    const params = new URLSearchParams(window.location.search);

    const usuario = {
        success: params.get("success") === "true",
        message: params.get("message") || "Login exitoso",
        documento: Number(params.get("documento")),
        nombre: params.get("nombre"),
        apellido: params.get("apellido"),
        correo: params.get("correo"),
        rol: params.get("rol"),
        token: params.get("token"),
        direccion: params.get("direccion"),
        barrio: params.get("barrio")
    };

    if (usuario.success && usuario.token && usuario.correo && usuario.rol) {
        localStorage.setItem("usuario", JSON.stringify(usuario));

        if (usuario.rol === "ADMIN") {
            window.location.href = "/admin";
        } else {
            window.location.href = "/catalogo";
        }
    } else {
        window.location.href = "/login";
    }
</script>

</body>
</html>
