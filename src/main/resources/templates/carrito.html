<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{cart.page.title}">Carrito | INDIRA</title>

    <link rel="stylesheet" href="/css/carrito.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="/javascript/global.js" defer></script>
    <script src="/javascript/carrito.js" defer></script>
</head>
<body>

<header class="main-header">

    <div class="brand-section">

        <img src="/images/logo.png"
             th:alt="#{cart.logo.alt}"
             alt="Logo Indira"
             class="logo-img">

        <img src="/images/nombre.png"
             th:alt="#{cart.name.alt}"
             alt="Indira"
             class="name-img">

        <img src="/images/slogan.png"
             th:alt="#{cart.slogan.alt}"
             alt="Slogan"
             class="slogan-img">

    </div>

    <nav class="navbar"></nav>

</header>

<main class="cart-container">

    <section class="cart-header">

        <span th:text="#{cart.header.label}">Compras</span>

        <h1 th:text="#{cart.header.title}">Tu carrito</h1>

        <p th:text="#{cart.header.description}">
            Visualiza los vestidos seleccionados antes de finalizar tu compra.
        </p>

    </section>

    <!-- TABLA -->

    <section class="table-section" id="tableSection">

        <div class="table-wrapper">

            <table class="cart-table">

                <thead>
                <tr>
                    <th th:text="#{cart.table.dress}">Vestido</th>
                    <th th:text="#{cart.table.model}">Modelo</th>
                    <th th:text="#{cart.table.size}">Talla</th>
                    <th th:text="#{cart.table.price}">Precio</th>
                    <th th:aria-label="#{cart.table.actions}" aria-label="Acciones"></th>
                </tr>
                </thead>

                <tbody id="cartBody"></tbody>

            </table>

        </div>

        <div class="cart-summary">

            <div class="summary-card">

                <span th:text="#{cart.summary.total}">Total</span>

                <h2 id="totalPrice">$0</h2>

                <div class="summary-buttons">

                    <a th:href="@{/historial(lang=${#locale.language})}"
                       href="/historial"
                       class="history-btn">

                        <i class="bi bi-clock-history"></i>
                        <span th:text="#{cart.button.history}">Historial</span>

                    </a>

                    <button id="buyBtn"
                            class="buy-btn">

                        <i class="bi bi-credit-card-fill"></i>
                        <span th:text="#{cart.button.buy}">Realizar compra</span>

                    </button>

                </div>

            </div>

        </div>

    </section>

    <!-- VACÍO -->

    <section class="empty-cart"
             id="emptyCart">

        <i class="bi bi-cart-x-fill"></i>

        <h2 th:text="#{cart.empty.title}">Tu carrito está vacío</h2>

        <p th:text="#{cart.empty.description}">
            Explora el catálogo y encuentra el vestido ideal para ti.
        </p>

        <a th:href="@{/catalogo(lang=${#locale.language})}"
           href="/catalogo"
           th:text="#{cart.empty.button}">
            Ver catálogo
        </a>

    </section>

</main>

<footer class="footer">
    <p th:text="#{cart.footer}">© 2026 Indira trajes típicos</p>
</footer>

</body>
</html>
